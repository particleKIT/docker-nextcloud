<VirtualHost *:80>
    ServerAdmin {NC_EMAIL}
    ServerName {NC_DOMAIN}
    DocumentRoot {NC_WWW}

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory {NC_WWW}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/lib/nextcloud>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Do not expose the NC data dir directly
    <DirectoryMatch "^/var/lib/nextcloud/(data|apps)/">
        Require all denied
    </DirectoryMatch>
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin {NC_EMAIL}
    ServerName {NC_DOMAIN}
    DocumentRoot {NC_WWW}

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined

    SSLEngine on
    SSLCertificateFile      {NC_SSL_CERTIFICATE}
    SSLCertificateKeyFile   {NC_SSL_KEY}
    SSLCertificateChainFile {NC_SSL_CHAIN}

    Header always add Strict-Transport-Security "max-age=15768000"

    <Directory {NC_WWW}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/lib/nextcloud>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Do not expose the NC data dir directly
    <DirectoryMatch "^/var/lib/nextcloud/(data|apps)/">
        Require all denied
    </DirectoryMatch>

    # Nextcloud has to know that the request came in over TLS
    RequestHeader set X-Forwarded-Proto "https"
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</VirtualHost>
